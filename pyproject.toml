[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "IronDome"
dynamic = ["version"]
description = "A local vault for passwords, API keys and 2FA codes. AI agents get scoped, expiring grants: secrets injected into commands with output masked, via the CLI or an MCP server. Secure Enclave or TPM 2.0 binding when present; no network code."
readme = "README.md"
# PEP 639: the SPDX expression is the license metadata (Metadata 2.4) and it
# covers everything the distributions contain: the code is GPL-3.0-only, and the
# EFF passphrase word list is shipped unchanged under CC BY 3.0 US, with its notice.
# No "License ::" classifier: setuptools refuses one next to a license expression.
# scripts/check.sh refuses a build whose LICENSE is not the verbatim GPL-3.0 text.
license = "GPL-3.0-only AND CC-BY-3.0-US"
license-files = ["LICENSE", "src/irondome/data/eff_large_wordlist.LICENSE.txt"]
requires-python = ">=3.9.2"  # cryptography 50 excludes 3.9.0 and 3.9.1
authors = [{ name = "Nir Elmaliah (King.Hippopotamus)" }]
keywords = [
    "password-manager", "secrets", "secrets-manager", "vault", "cli",
    "ai-agents", "llm", "mcp", "model-context-protocol", "api-keys", "credentials",
    "secure-enclave", "touch-id", "tpm", "tpm2", "hardware-security",
    "totp", "2fa", "argon2", "aes-gcm", "encryption",
    "local-first", "zero-network", "offline", "macos", "linux", "irondome",
]
# scripts/site_data.py reads the "Programming Language :: Python :: 3.N" lines
# for the website's Python range: keep one quoted string per version.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: Utilities",
    "Typing :: Typed",
]
# One runtime dependency, on purpose. tests/claims enforces that it stays one.
# The floor is the first release with no known advisory and with the
# derive_into / decrypt_into APIs that keep keys out of immutable objects.
dependencies = [
    "cryptography>=50.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.14",
    "mypy>=1.14",
    # Only where the distributions are built and checked (scripts/check.sh, ci.yml): the releases of twine
    # and of what it brings (requests, urllib3) that still run on Python 3.9 and 3.10 have known advisories.
    "twine>=6.2 ; python_version >= '3.11'",
]

[dependency-groups]
# CI tools, hash-locked like everything else: ci.yml and scripts/check.sh run them with `uv run --locked --only-group ci`.
ci = ["pip-audit>=2.10.1", "zizmor>=1.0"]

[project.scripts]
# One command. The 3.x names `irondome-cli` and `bunker` are gone.
irondome = "irondome.cli.main:main"

[project.urls]
# The repository is TheKingHippopotamus/IronDome on GitHub (the name of a
# local folder is not the repository's name). Labels follow PEP 753.
Homepage = "https://iron-dome-bunker.vercel.app"
Documentation = "https://github.com/TheKingHippopotamus/IronDome/tree/main/docs"
Source = "https://github.com/TheKingHippopotamus/IronDome"
Issues = "https://github.com/TheKingHippopotamus/IronDome/issues"
Changelog = "https://github.com/TheKingHippopotamus/IronDome/blob/main/CHANGELOG.md"
Security = "https://github.com/TheKingHippopotamus/IronDome/blob/main/SECURITY.md"

[tool.setuptools.dynamic]
version = { attr = "irondome.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Data files by name: a wildcard would ship whatever else lands in data/.
irondome = [
    "claims.json",
    "data/eff_large_wordlist.txt",
    "data/eff_large_wordlist.LICENSE.txt",
    "device/*.swift",
    "py.typed",
]

[tool.uv]
# A release is not resolved until it has been public for a week: most
# malicious package versions are caught and pulled within days. 0.13.4 is the
# first uv that no longer trusts the compromised emSign root certificates.
exclude-newer = "7 days"
required-version = ">=0.13.4"
# Version-pins the build backend for the editable builds `uv sync` does (no hash is possible there).
# Keep the first pin equal to BUILD_CONSTRAINTS in scripts/check.sh: releases are built with it.
# setuptools 83 dropped Python 3.9, so a 3.9 environment gets the last release that still runs there.
build-constraint-dependencies = [
    "setuptools==84.2.1 ; python_full_version >= '3.10'",
    "setuptools==82.0.1 ; python_full_version < '3.10'",
]

[tool.uv.dependency-groups]
ci = { requires-python = ">=3.11" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "secure_enclave: needs an Apple Secure Enclave (runs automatically on a Mac that has one)",
    "tpm: needs a TPM 2.0 reachable through tpm2-tools (IRONDOME_TEST_TPM=1; see scripts/test-linux.sh)",
    "interactive: needs a person at the sensor (IRONDOME_TEST_INTERACTIVE=1)",
]

[tool.coverage.run]
source = ["irondome"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

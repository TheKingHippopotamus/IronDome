name: ci

# Every action is pinned to a full commit hash; the tag is a comment for humans.
# Pins are refreshed by Dependabot (see .github/dependabot.yml). Every tool comes
# from uv.lock, hash-checked; the build backend is pinned by hash in
# scripts/check.sh. release.yml runs this whole workflow on the tagged commit
# before it builds anything.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1" # Mondays: a new advisory against an unchanged lockfile still fails CI
  workflow_call:

permissions: {}

# A newer push to a pull request cancels the older run. Every other run (main,
# the weekly one, a release tag) has a group of its own, so none is ever
# cancelled or left pending behind another: main's record has no gaps.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # No Intel Mac here: cryptography 50.0.2 publishes no macOS x86-64 wheel,
      # so there it is compiled from source, which uv.lock does not cover.
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      - name: Install from the lockfile
        run: uv sync --locked --extra dev
      - name: Test
        run: uv run --no-sync pytest -q

  tpm:
    name: TPM 2.0 (scripts/test-linux.sh, swtpm, py3.9 + py3.14)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same harness as on a laptop: the image installs what uv.lock pins,
      # the tests run with no network, and the run fails if the TPM is unusable.
      - name: The whole suite in a container against a software TPM
        env:
          IRONDOME_CONTAINER_ENGINE: docker
        run: bash scripts/test-linux.sh -p 3.9 -p 3.14

  checks:
    name: lint, claims, audit, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      - run: uv sync --locked --extra dev
      - name: Lint
        run: uv run --no-sync ruff check src tests scripts
      - name: Type check
        run: uv run --no-sync mypy src
      - name: The claims document matches the registry
        run: uv run --no-sync python scripts/claims.py --check
      - name: The lockfile matches pyproject.toml
        run: uv lock --check
      # Everything uv.lock pins (runtime, the dev extra, the ci group), audited by
      # the pip-audit uv.lock pins: the same scope and tool as scripts/check.sh.
      - name: No known vulnerability in any locked dependency
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/ci-venv
        run: |
          uv export --quiet --locked --all-extras --all-groups --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uv run --quiet --locked --only-group ci pip-audit --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"
      - name: Build the distributions (backend pinned by hash) and check them
        run: |
          bash scripts/check.sh --build dist
          uv run --no-sync twine check --strict dist/*

  workflows:
    name: audit the workflows themselves
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      # zizmor as uv.lock pins it. With the token, its online audits also check
      # that every pinned commit really is the tag its comment names.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/ci-venv
        run: uv run --quiet --locked --only-group ci --python 3.13 zizmor --format=github .

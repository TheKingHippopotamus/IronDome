name: release

# Publishes to PyPI through Trusted Publishing: no API token exists anywhere.
#
#   ci       the whole of ci.yml, on the tagged commit. Every test, test tool and
#            dev dependency runs here, on other runners, before dist/ exists.
#   build    a fresh checkout that runs nothing but scripts/check.sh --build:
#            `uv build` with the build backend pinned by hash, then the check of
#            what was built (named for the tag, only committed files, the whole
#            package, the verbatim GPL-3.0 LICENSE). No dev dependency, no test
#            and no other build backend runs where dist/ is written, and this
#            job has no publishing rights.
#   publish  has no source code and only uploads what the build job produced.
#            PyPI attaches signed provenance (PEP 740) to every file.

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  ci:
    # A reusable workflow named this way is read from the tagged commit when the run starts, not from the workspace,
    # so no earlier step can swap it. The `$/` form (GitHub, July 2026) is kept out until it has run here.
    uses: ./.github/workflows/ci.yml  # zizmor: ignore[self-repository]
    permissions:
      contents: read

  build:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Build, and check that the distributions are the tag's and hold nothing else
        run: bash scripts/check.sh --build dist --release "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
